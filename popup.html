<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wolt Time</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; width: 300px; background: #14161b; color: #fff; }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .muted { font-size: 12px; opacity: 0.7; margin-bottom: 10px; }
    .row { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-top: 1px solid rgba(255,255,255,0.1); }
    .row b { font-variant-numeric: tabular-nums; }
    .hist { margin-top: 10px; font-size: 12px; }
    .hist-t { color: #00C2E8; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin: 10px 0 4px; }
    .hist-row { display: flex; gap: 8px; padding: 3px 0; font-variant-numeric: tabular-nums; }
    .hist-dot { width: 8px; height: 8px; border-radius: 50%; background: #00C2E8; flex: none; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Wolt Time</h1>
  <div class="muted" id="orderLine">No tracking order detected.</div>
  <div id="stats" hidden>
    <div class="row"><span>Original</span><b id="fOriginal">–</b></div>
    <div class="row"><span>Live</span><b id="fLive">–</b></div>
    <div class="row"><span>ETA clock</span><b id="fEta">–</b></div>
    <div class="row"><span>Drift</span><b id="fDrift">–</b></div>
  </div>
  <div class="hist" id="histWrap" hidden>
    <div class="hist-t" id="histTitle">Estimate history</div>
    <div id="hist"></div>
  </div>
  <script src="src/popup.js"></script>
</body>
</html>
